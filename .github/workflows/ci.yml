name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: code-demo-typer-vsix
          path: code-demo-typer-*.vsix
